# DF-IPAM behind Apache, in place of the web container (docs/operations/setup.md,
# "Run it behind Apache"). Apache serves the built web app from /var/www/df-ipam and
# passes /api/ to the backend container, published on 127.0.0.1:8080 only.
#
# Needs: a2enmod ssl headers proxy proxy_http rewrite reqtimeout remoteip
# Replace ipam.dialogfinance.lk, the certificate paths, and the office and VPN ranges.

<VirtualHost *:80>
    ServerName ipam.dialogfinance.lk
    Redirect permanent / https://ipam.dialogfinance.lk/
</VirtualHost>

<VirtualHost *:443>
    ServerName ipam.dialogfinance.lk

    SSLEngine on
    SSLCertificateFile    /etc/ssl/df-ipam/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/df-ipam/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off

    # Slow clients can't hold connections open.
    RequestReadTimeout header=10-20,MinRate=500 body=15,MinRate=500
    LimitRequestFieldSize 16384

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    Header always unset X-Powered-By

    # The web app. Unknown paths load index.html, so the app's own links work.
    DocumentRoot /var/www/df-ipam
    <Directory /var/www/df-ipam>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        # Who may open the site: your office and VPN ranges. Don't leave 10.0.0.0/8.
        Require ip 10.0.0.0/8
        FallbackResource /index.html
    </Directory>
    <Directory /var/www/df-ipam/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    # The API. Apache adds X-Forwarded-For; the backend trusts it only from here.
    ProxyRequests     Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /api/ http://127.0.0.1:8080/api/ connectiontimeout=5 timeout=60
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    <Location /api/>
        Require ip 10.0.0.0/8
        LimitRequestBody 2097152
    </Location>
    # Imports take files of up to 5 MB.
    <LocationMatch "^/api/v1/(devices|ip-addresses|segments|network-links)/import$">
        LimitRequestBody 8388608
    </LocationMatch>
    # Network link attachments take files of up to 15 MB.
    <LocationMatch "^/api/v1/network-links/[0-9a-f-]+/attachments$">
        LimitRequestBody 17825792
    </LocationMatch>

    # Health checks stay on the server itself: curl http://127.0.0.1:8080/ready
    ErrorLog  ${APACHE_LOG_DIR}/df-ipam-error.log
    CustomLog ${APACHE_LOG_DIR}/df-ipam-access.log combined
</VirtualHost>

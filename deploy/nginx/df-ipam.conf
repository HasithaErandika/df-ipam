# DF-IPAM site. Copy to /etc/nginx/sites-available/df-ipam and replace:
#   ipam.example.com       your DF-IPAM host name
#   <project-ref>          your Supabase project reference
# Pick one access block in deploy/nginx/access-*.conf, as docs/setup.md explains.

limit_req_zone $binary_remote_addr zone=dfipam_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=dfipam_agent:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=dfipam_static:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=dfipam_conn:10m;
limit_req_status 429;
limit_conn_status 429;

upstream dfipam_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name ipam.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ipam.example.com;

    ssl_certificate     /etc/ssl/df-ipam/fullchain.pem;
    ssl_certificate_key /etc/ssl/df-ipam/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:dfipam:10m;
    ssl_session_tickets off;

    # An office behind one NAT address counts as one client, so raise these if
    # real people start seeing 429.
    limit_conn dfipam_conn 50;

    # Slow clients can't hold connections open.
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    large_client_header_buffers 4 16k;
    reset_timedout_connection on;

    # The web app reads this format, so people see a clear message.
    error_page 429 = @limited;
    location @limited {
        internal;
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Try again shortly.","correlationId":""}}';
    }

    # Who may reach the site. Exactly one of these files.
    include /etc/nginx/df-ipam-access.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://<project-ref>.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Imports reach 1 MB in the API, so anything larger stops here.
    client_max_body_size 2m;

    root /var/www/df-ipam;
    index index.html;

    location / {
        limit_req zone=dfipam_static burst=100 nodelay;
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        limit_req zone=dfipam_api burst=60 nodelay;
        proxy_pass http://dfipam_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Agents get their own, tighter limit and may sit on different networks.
    location = /api/v1/agent-api/register {
        include /etc/nginx/df-ipam-agents.conf;
        limit_req zone=dfipam_agent burst=2 nodelay;
        proxy_pass http://dfipam_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/agent-api/ {
        include /etc/nginx/df-ipam-agents.conf;
        limit_req zone=dfipam_agent burst=20 nodelay;
        client_max_body_size 2m;
        proxy_pass http://dfipam_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health checks stay on the server itself.
    location = /health { allow 127.0.0.1; deny all; proxy_pass http://dfipam_api; }
    location = /ready  { allow 127.0.0.1; deny all; proxy_pass http://dfipam_api; }
}

# Production: mounted over site-http.conf by docker-compose.prod.yml. Certificates come
# from /etc/ssl/df-ipam on the host.
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/df-ipam/fullchain.pem;
    ssl_certificate_key /etc/ssl/df-ipam/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:dfipam:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/conf.d/app.inc;
}

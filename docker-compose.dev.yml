# Local use. Everything is published on localhost only: `make test-db` needs the
# database, Vite proxies to the backend, and the web container is at port 8088.
services:
  db:
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
  backend:
    environment:
      # Vite reaches the backend through the Docker gateway.
      TRUSTED_PROXIES: ${WEB_ADDRESS:-172.30.0.10},${DOCKER_GATEWAY:-172.30.0.1}
    ports:
      - 127.0.0.1:${API_PORT:-8080}:8080
  web:
    ports:
      - 127.0.0.1:${WEB_PORT:-8088}:8080

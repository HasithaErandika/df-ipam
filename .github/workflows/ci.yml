name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the newest run of a branch matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs ask for more only if they need it.
permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt on: $unformatted"
            exit 1
          fi
      - name: Check module files are tidy
        run: |
          GOFLAGS= go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Size and complexity rules
        working-directory: .
        run: make lint-size
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: go build -o bin/ ./cmd/...

  # The schema rules, RLS, every API route, imports and sign-in run against a real
  # database. They skip without one, so a skip here fails the job.
  api-db:
    name: API (database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: dfipam_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d dfipam_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/dfipam_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/dfipam_test?sslmode=disable
      TEST_APP_DATABASE_URL: postgres://dfipam_app:ci-app-only@localhost:5432/dfipam_test?sslmode=disable
      TEST_DB_MAX_CONNS: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Create the app role
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE dfipam_app LOGIN PASSWORD 'ci-app-only'"
      - name: Migrate and seed
        run: go run ./cmd/migrate up && go run ./cmd/seed
      - name: Test
        run: |
          go test -p 1 -count=1 -v ./internal/dbrules ./internal/server ./internal/scanner | tee test.log
          status=${PIPESTATUS[0]}
          if grep -q -- '--- SKIP' test.log; then
            grep -- '--- SKIP' test.log
            echo "::error::Database tests were skipped"
            exit 1
          fi
          exit "$status"

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Scan Go dependencies
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - name: Scan web dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level high

  # One required check, so branch protection survives job changes.
  ci-passed:
    name: CI passed
    if: always()
    needs: [api, api-db, web, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi

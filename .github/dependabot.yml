version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /web
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: monthly

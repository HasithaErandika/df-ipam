# PostgreSQL, the backend and the web app. Run it through make (see `make help`):
# make loads api/.env and passes values through by name, so a `$` in a secret stays
# literal. There is no env file at the repository root, by design. No port is published
# here: docker-compose.dev.yml does that on localhost, and docker-compose.prod.yml on 80
# and 443 for the web container only.
name: df-ipam

x-backend: &backend
  image: df-ipam-backend:local
  build:
    context: ./api
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

# A key with no value is copied from the shell that make prepared.
x-backend-env: &backend-env
  APP_ENV:
  LOG_LEVEL:
  CORS_ALLOWED_ORIGINS:
  SUPABASE_URL:
  SUPABASE_ANON_KEY:
  SUPABASE_SERVICE_ROLE_KEY:
  AUTH_AUDIENCE:
  APP_BASE_URL:
  SECRET_ENCRYPTION_KEY:
  SECRET_ENCRYPTION_KEY_VERSION:
  SECRET_ENCRYPTION_KEY_PREVIOUS:
  INTEGRATION_ALLOWED_HOSTS:
  INTEGRATION_ALLOWED_PRIVATE_RANGES:
  INTEGRATION_CA_FILE:
  SMTP_HOST:
  SMTP_PORT:
  SMTP_USERNAME:
  SMTP_PASSWORD:
  MAIL_FROM:
  DATABASE_URL: postgres://dfipam_app:${DFIPAM_APP_PASSWORD:?use make, or set it in api/.env}@db:5432/${POSTGRES_DB:-dfipam}?sslmode=disable

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dfipam}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?use make, or set it in api/.env}
      DFIPAM_APP_PASSWORD: ${DFIPAM_APP_PASSWORD:?use make, or set it in api/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs once and exits. The API and worker wait for it.
  migrate:
    <<: *backend
    command: [sh, -c, /app/migrate up && /app/seed]
    environment:
      MIGRATION_DATABASE_URL: &owner-url postgres://postgres:${POSTGRES_PASSWORD:?use make, or set it in api/.env}@db:5432/${POSTGRES_DB:-dfipam}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # The API and the background worker, in one process.
  backend:
    <<: *backend
    command: [/app/server]
    restart: unless-stopped
    environment:
      <<: *backend-env
      API_LISTEN_ADDR: 0.0.0.0:8080
      # Only the web container may set the client address. Without this, every user
      # would share one rate limit, and audit logs would show the wrong address.
      TRUSTED_PROXIES: ${WEB_ADDRESS:-172.30.0.10}
      API_MAX_IN_FLIGHT:
      WORKER_ENABLED:
      DB_MAX_CONNS: ${BACKEND_DB_MAX_CONNS:-30}
    networks:
      default:
        ipv4_address: ${BACKEND_ADDRESS:-172.30.0.11}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/ready]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Nginx: serves the web app, and is the only way in to the API.
  web:
    image: df-ipam-web:local
    build:
      context: ./web
      args:
        VITE_SUPABASE_URL:
        VITE_SUPABASE_ANON_KEY:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      SUPABASE_URL:
      NGINX_ENVSUBST_FILTER: ^SUPABASE_URL$
    networks:
      default:
        ipv4_address: ${WEB_ADDRESS:-172.30.0.10}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/nginx-health]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy

# Fixed, so the backend can trust the web container and no other address.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}
          gateway: ${DOCKER_GATEWAY:-172.30.0.1}

volumes:
  db-data:

    get: { summary: Get a application, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { summary: Update a application, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete a application, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /teams:
    get: { summary: List team records. Supports page, pageSize and q, responses: { '200': { description: OK } } }
    post: { summary: Create a team, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /teams/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a team, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { summary: Update a team, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete a team, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /devices:
    get: { summary: List device records. Supports page, pageSize and q, responses: { '200': { description: OK } } }
    post: { summary: Create a device, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /devices/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a device, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { summary: Update a device, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete a device, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /interfaces:
    get: { summary: List device interface records. Supports page, pageSize and q, responses: { '200': { description: OK } } }
    post: { summary: Create a device interface, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /interfaces/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a device interface, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { summary: Update a device interface, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete a device interface, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /reserved-ranges:
    get: { summary: List reserved range records. Supports page, pageSize and q, responses: { '200': { description: OK } } }
    post: { summary: Create a reserved range, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /reserved-ranges/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a reserved range, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { summary: Update a reserved range, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete a reserved range, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /dhcp-scopes:
    get: { summary: List dhcp scope records. Supports page, pageSize and q, responses: { '200': { description: OK } } }
    post: { summary: Create a dhcp scope, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /dhcp-scopes/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a dhcp scope, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { summary: Update a dhcp scope, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete a dhcp scope, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /overlap-exceptions:
    get: { summary: List overlap exception records. Supports page, pageSize and q, responses: { '200': { description: OK } } }
    post: { summary: Create a overlap exception, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /overlap-exceptions/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a overlap exception, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { summary: Update a overlap exception, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete a overlap exception, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /users/invite:
    post: { summary: Send a sign-up invitation, responses: { '204': { description: Sent }, '409': { $ref: '#/components/responses/Error' } } }
  /dashboard/summary:
    get: { summary: Inventory counts, responses: { '200': { description: OK } } }
  /audit-logs:
    get: { summary: Read the audit trail, responses: { '200': { description: OK } } }
  /requests:
    get:
      summary: List requests. Without approve, allocate, reserve or audit permission, only your own
      parameters:
        - { name: status, in: query, schema: { type: string, description: 'A status, or "open" for draft, pending and approved' } }
        - { name: type, in: query, schema: { type: string, enum: [allocation, reservation, release] } }
        - { name: mine, in: query, schema: { type: boolean } }
        - { name: subnetId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
    post:
      summary: Create a draft request. Send submit=true to submit it at once
      responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /requests/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a request with its approval steps and result, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch:
      summary: Replace a draft's fields. Requester only. Send the version in If-Match
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' }, '412': { $ref: '#/components/responses/Error' } }
    delete: { summary: Delete a draft. Requester only, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /requests/{id}/submit:
    post: { summary: Submit a draft for approval, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' } } }
  /requests/{id}/cancel:
    post: { summary: Cancel a request that is not yet fulfilled, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' } } }
  /approvals:
    get: { summary: Approval steps the caller may decide now, responses: { '200': { description: OK } } }
  /approvals/{id}/approve:
    post:
      summary: Approve a step. Never your own request, and at most one step per request
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /approvals/{id}/reject:
    post:
      summary: Reject a step. A comment is required
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /approval-workflows:
    get: { summary: List approval workflows, responses: { '200': { description: OK } } }
    post: { summary: Create a workflow with one to five steps, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /approval-workflows/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put: { summary: Replace a workflow. Submitted requests keep their steps, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete a workflow no request has used, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /allocations:
    get:
      summary: List allocations. Status defaults to active
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, released, all] } }
        - { name: subnetId, in: query, schema: { type: string, format: uuid } }
        - { name: routingDomainId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
    post:
      summary: Fulfil an approved allocation request. Repeating it returns the same allocation with 200
      responses: { '200': { description: Already allocated }, '201': { description: Allocated }, '409': { $ref: '#/components/responses/Error' } }
  /allocations/{id}:
    get: { summary: Get an allocation, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: OK } } }
  /allocations/{id}/release:
    post: { summary: Fulfil an approved release request for this allocation, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' } } }
  /reservations:
    get:
      summary: List reservations. Status defaults to active
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, released, expired, converted, all] } }
        - { name: expiringWithinDays, in: query, schema: { type: integer } }
        - { name: subnetId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
    post:
      summary: Fulfil an approved reservation request. Repeating it returns the same reservation with 200
      responses: { '200': { description: Already reserved }, '201': { description: Reserved }, '409': { $ref: '#/components/responses/Error' } }
  /reservations/{id}:
    get: { summary: Get a reservation, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: OK } } }
  /reservations/{id}/extend:

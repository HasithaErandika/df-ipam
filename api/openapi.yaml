      summary: Search subnets, IP records, blocks, sites, VLANs, VDOMs, devices and DNS records. An address or CIDR matches by containment
      parameters: [{ name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }]

  /dhcp-scopes/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a dhcp scope, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { summary: Update a dhcp scope, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete a dhcp scope, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /overlap-exceptions:

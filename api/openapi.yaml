    patch: { summary: Update a site, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete a site, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /network-zones:

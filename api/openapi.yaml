    post: { summary: Create a vlan, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /vlans/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]

openapi: 3.1.0
info:
  title: DF-IPAM API
  version: 0.1.0
  description: Every implemented route. A test fails if a route is missing. See docs/api.md for the full plan.
servers:
  - url: /api/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    page: { name: page, in: query, schema: { type: integer, minimum: 1 } }
    pageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { type: string }
            message: { type: string }
            correlationId: { type: string }
            details:
              type: array
              items:
                type: object
                properties: { field: { type: string }, issue: { type: string } }
    SubnetCreate:
      type: object
      required: [routingDomainId, cidr, name, environment]
      properties:
        routingDomainId: { type: string, format: uuid }
        cidr: { type: string, example: 10.0.0.0/24 }
        name: { type: string }
        gateway: { type: [string, 'null'] }
        environment: { type: string, enum: [production, disaster_recovery, uat, development, testing] }
        securityZone: { type: string }
        description: { type: string }
        discoveryEnabled: { type: boolean }
        warnThreshold: { type: integer }
        criticalThreshold: { type: integer }
  responses:
    Error:
      description: Failure in the shared error format
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
paths:
  /auth/me:
    get: { summary: Current user, roles and permissions, responses: { '200': { description: OK } } }
  /users:
    get: { summary: List users, responses: { '200': { description: OK } } }
  /roles:
    get: { summary: List roles, responses: { '200': { description: OK } } }
  /users/{id}/roles:
    put:
      summary: Replace a user's roles
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: Updated }, '403': { $ref: '#/components/responses/Error' } }
  /organisations:
    get: { summary: List organisations, responses: { '200': { description: OK } } }
    post: { summary: Create an organisation and its Default routing domain, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' } } }
  /organisations/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get an organisation, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { summary: Rename an organisation or change its code, responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete an organisation and its unused routing domains, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /routing-domains:
    get: { summary: List routing domains, responses: { '200': { description: OK } } }
    post: { summary: Create a routing domain, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' } } }
  /routing-domains/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a routing domain, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { summary: Update a routing domain's name, type, route distinguisher or isolation, responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete a routing domain nothing refers to, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /subnets:
    get:
      summary: List subnets
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: q, in: query, schema: { type: string } }
        - { name: routingDomainId, in: query, schema: { type: string, format: uuid } }
        - { name: environment, in: query, schema: { type: string } }
        - { name: family, in: query, schema: { type: integer, enum: [4, 6] } }
        - { name: includeArchived, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, example: -updatedAt } }
      responses: { '200': { description: OK } }
    post:
      summary: Create a subnet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubnetCreate' }
      responses:
        '201': { description: Created }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /subnets/calculate:
    post: { summary: Calculate details for a CIDR, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
  /subnets/check-overlap:
    post: { summary: List subnets a CIDR would overlap, responses: { '200': { description: OK } } }
  /subnets/bulk:
    post:
      summary: Update, archive or delete up to 500 subnets in one transaction. Delete also needs inventory:delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids: { type: array, maxItems: 500, items: { type: string, format: uuid } }
                action: { type: string, enum: [update, archive, delete] }
                changes: { type: object, description: Same fields as a subnet update, except name and gateway }
      responses: { '200': { description: Number of subnets affected }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /subnets/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a subnet, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch:
      summary: Update a subnet. Send the record version in If-Match
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '412': { $ref: '#/components/responses/Error' } }
    delete: { summary: Delete an unused subnet, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /subnets/{id}/archive:
    post:
      summary: Archive a subnet
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: Archived } }
  /subnets/{id}/utilisation:
    get: { summary: Capacity breakdown, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: OK } } }
  /subnets/{id}/free-ranges:
    get: { summary: Free ranges and their CIDRs, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: OK } } }
  /subnets/{id}/addresses:
    get:
      summary: One page of the address grid. Offset is a string-safe integer, limit is 1 to 1024
      parameters:
        - { $ref: '#/components/parameters/id' }
        - { name: offset, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 1024 } }
      responses: { '200': { description: OK } }
  /network-blocks/{id}/free-space:
    get: { summary: Space left in a block, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: OK } } }
  /tools/split:
    post: { summary: Split a CIDR into smaller subnets, responses: { '200': { description: OK } } }
  /tools/summarise:
    post: { summary: Reduce CIDRs to the fewest covering prefixes, responses: { '200': { description: OK } } }
  /tools/locate:
    get: { summary: Find the subnet holding an address in each routing domain, responses: { '200': { description: OK } } }
  /ip-addresses:
    get: { summary: Search IP records, responses: { '200': { description: OK } } }
    post: { summary: Create a record in the most specific subnet, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /ip-addresses/bulk:
    post: { summary: Apply one change to up to 500 records in one transaction. Hostname, FQDN and MAC can't be bulk-changed, responses: { '200': { description: Number of records affected }, '422': { $ref: '#/components/responses/Error' } } }
  /ip-addresses/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a record, responses: { '200': { description: OK } } }
    patch: { summary: Update a record. Releasing needs a reason, responses: { '200': { description: OK } } }
  /ip-addresses/{id}/history:
    get: { summary: Change history, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: OK } } }
  /ip-addresses/{id}/evidence:
    get: { summary: Raw evidence, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: OK } } }
  /reconciliation/results:
    get: { summary: List findings, responses: { '200': { description: OK } } }
  /reconciliation/summary:
    get: { summary: Open findings by classification, responses: { '200': { description: OK } } }
  /reconciliation/run:
    post: { summary: Run every rule. Never changes inventory, responses: { '200': { description: OK } } }
  /reconciliation/results/{id}/review:
    post: { summary: Record a review decision, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '204': { description: Saved } } }
  /business-units:
    get: { summary: List business unit records. Supports page, pageSize and q, responses: { '200': { description: OK } } }
    post: { summary: Create a business unit, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /business-units/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get a business unit, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { summary: Update a business unit, responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Delete a business unit, responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /sites:
    get: { summary: List site records. Supports page, pageSize and q, responses: { '200': { description: OK } } }
    post: { summary: Create a site, responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /sites/{id}:
